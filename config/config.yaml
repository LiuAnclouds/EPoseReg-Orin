# 跌倒检测系统配置文件
# 建议：只通过此文件修改运行行为，无需命令行参数

# ============================================================
# 1. 模型路径相关
# ============================================================
model:
  # YOLOv8-Pose：同时输出人框 + COCO 17 点关键点
  yolo_pose: "./checkpoints/yolov8n-pose.engine"
  # STGCN：支持 .engine 或 .onnx（优先 GPU，没 GPU 自动用 CPU）
  stgcn: "./checkpoints/stgcn.engine"


# ============================================================
# 2. 输入源相关
# ============================================================
input:
  # 摄像头 ID (如 "0", "1") 或 视频/图片路径
  # Windows 路径请使用正斜杠 / 或 双反斜杠 \\
  # 示例: "0" 或 "1" (摄像头), "F:/path/to/video.avi" (视频), "F:/path/to/image.jpg" (图片)
  source: "video.avi"

  # 运行模式（目前统一走视频模式，主要影响后续扩展）
  # - "auto"   自动识别（数字视为摄像头，其余视为视频文件）
  # - "video"  视频文件 / 摄像头
  # - "camera" 摄像头（等价于 video）
  mode: "auto"

  # 图像旋转角度: 0 / 90 / 180 / 270
  rotate: 0


# ============================================================
# 3. 输出与可视化
# ============================================================
output:
  # 是否显示结果窗口（普通模式和 benchmark 模式都会参考此开关）
  show_result: True
  # 窗口标题
  window_name: "Fall Detection"

  # 是否保存预测结果视频（仅当 input.source 为 .mp4/.avi 视频文件时生效）
  save_video: true
  # 保存路径；为 null 时自动生成（output_时间戳.mp4）
  video_path: null
  # 保存视频 FPS；为 null 时使用输入 FPS（拿不到则用 30）
  video_fps: null


# ============================================================
# 4. 类别与 ID 显示
# ============================================================
# STGCN 输出的类别含义（class 0 和 1 分别代表什么）
class_mapping:
  "0": "Fall"    # class 0 表示跌倒
  "1": "Normal"  # class 1 表示正常


# ============================================================
# 5. 检测相关（YOLO + 关键点）
# ============================================================
detection:
  # YOLO 检测框置信度阈值
  box_conf_threshold: 0.75
  # 关键点置信度阈值（绘制骨架时使用）
  pose_conf_threshold: 0.05
  # 最小检测框尺寸（宽或高小于此值将被忽略）
  min_box_size: 10
  # 每帧最多处理多少人（按置信度排序），默认 1 人
  max_persons: 1


# ============================================================
# 6. 时序 / STGCN 推理
# ============================================================
processing:
  # 姿态估计间隔：每 N 帧做一次关键点（1 表示每帧都检测）
  pose_interval: 1
  # STGCN 窗口大小（帧数）
  window_size: 50
  # 每 N 帧做一次跌倒预测
  prediction_interval: 1
  # 缓冲区大小倍数（window_size * multiplier）
  buffer_multiplier: 2
  # 最小预测帧数（小于此值不预测，0 表示允许任意帧数预测）
  min_frames_for_prediction: 30
  # 是否使用滑动窗口（true=只使用最新 N 帧，false=使用全部缓冲区）
  use_sliding_window: true
  # 二次确认：连续多少帧预测为跌倒才判定为跌倒（>=1）
  fall_confirm_frames: 8
  # 跌倒类别概率的最低阈值（0-1），低于此值不计入连续跌倒帧
  fall_prob_threshold: 0.15


# ============================================================
# 7. 设备相关
# ============================================================
device:
  # 单开关：true = 全链路尽量用 GPU，false = 全链路 CPU
  use_cuda: true


# ============================================================
# 8. 运行时与 benchmark 模式
# ============================================================
runtime:
  # 是否输出详细调试信息（DEBUG 日志）
  verbose: true

  # 是否在图像上叠加 FPS 文本
  show_fps: true

  # 运行模式：
  # - "normal"    普通展示模式（默认）
  # - "benchmark" 基准测试模式：只打印关键置信度 + FPS
  mode: "normal"

  # benchmark 模式下是否仍然显示图像窗口
  # - false：只跑推理与打印 FPS
  # - true ：保留窗口（适合调参数时观察）
  benchmark_show_image: false

  # benchmark 模式下的显示风格：
  # - true ：仅显示黑底火柴人骨架（不显示原始画面）
  # - false：保持原始画面上叠加检测结果
  benchmark_skeleton_only: true

  # benchmark 模式下是否隐藏检测框，只保留火柴人骨架
  benchmark_hide_bbox: true

  # benchmark 模式下在控制台打印一次统计信息的帧间隔
  benchmark_log_interval: 60
